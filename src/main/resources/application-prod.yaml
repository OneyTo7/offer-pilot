spring:
  datasource:
    url: jdbc:mysql://mysql:3306/offer_pilot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_ROOT_PASSWORD}

  ai:
    datasource:
      vector:
        url: jdbc:postgresql://postgres:5432/offer_pilot_vector
        username: postgres
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver

minio:
  endpoint: http://minio:9000

logging:
  level:
    com.eyki.offerpilot: INFO