# 生产环境配置（Docker 部署）
# 数据源通过 Docker Compose 内部网络连接，无需 INFRA_HOST
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/offer_pilot
    username: postgres
    password: ${POSTGRES_PASSWORD:pgpass}
    driver-class-name: org.postgresql.Driver

  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}

minio:
  endpoint: http://minio:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}

logging:
  level:
    com.eyki.offerpilot: INFO