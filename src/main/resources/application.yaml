server:
  port: 8080

spring:
  application:
    name: offer-pilot
  profiles:
    active: local

  # Jackson 全局配置
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # Liquibase 迁移
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Spring AI - DeepSeek Chat Model
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE
        dimension: 512
        initialize-schema: true

    # Local embedding model (ONNX + BGE) for pgvector, no API key needed.
    # 模型从国内镜像 hf-mirror.com 下载（huggingface.co 国内不可达/过慢）。
    # 注意：BGE 的 ONNX 导出在 Xenova 仓库，BAAI 官方仓库没有 onnx 目录。
    # 可用 ONNX_MODEL_URI 环境变量替换（如量化的 model_quantized.onnx，约 23MB 更快）。
    embedding:
      transformer:
        onnx:
          model-uri: ${ONNX_MODEL_URI:https://hf-mirror.com/Xenova/bge-small-zh-v1.5/resolve/main/onnx/model.onnx}
        tokenizer:
          uri: ${ONNX_TOKENIZER_URI:https://hf-mirror.com/Xenova/bge-small-zh-v1.5/resolve/main/tokenizer.json}

    # Cross-encoder re-ranker (BGE-reranker ONNX) for post-retrieval re-ranking
    rag:
      reranker:
        model-uri: ${RERANKER_MODEL_URI:https://hf-mirror.com/Xenova/bge-reranker-base/resolve/main/onnx/model_quantized.onnx}
        tokenizer-uri: ${RERANKER_TOKENIZER_URI:https://hf-mirror.com/Xenova/bge-reranker-base/resolve/main/tokenizer.json}
        top-k: 5

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:offer-pilot-jwt-secret-key-change-in-production}

# MinIO 存储桶名
minio:
  bucket: offer-pilot-files

# 日志级别
logging:
  level:
    com.eyki.offerpilot: DEBUG