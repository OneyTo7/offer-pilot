server:
  port: 8080

spring:
  application:
    name: offer-pilot
  profiles:
    active: local

  # Jackson 全局配置
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # Liquibase 迁移
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Spring AI - DeepSeek (OpenAI 兼容 API)
  ai:
    openai:
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-chat
        temperature: 0.7
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE
        dimension: 512
        initialize-schema: true

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:offer-pilot-jwt-secret-key-change-in-production}

# MinIO 存储桶名
minio:
  bucket: offer-pilot-files

# 日志级别
logging:
  level:
    com.eyki.offerpilot: DEBUG