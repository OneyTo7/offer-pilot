server:
  port: 8080

spring:
  application:
    name: offer-pilot

  # Jackson 全局配置
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # MySQL 主数据源（业务数据）
  datasource:
    url: jdbc:mysql://14.103.58.208:3306/offer_pilot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: offer_pilot
    password: ${MYSQL_ROOT_PASSWORD:2rWBNKnjJfebpd2m}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # pgvector 数据源
    vector:
      url: jdbc:postgresql://14.103.58.208:5433/offer_pilot_vector
      username: postgres
      password: ${POSTGRES_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver

  # Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  
  # Spring AI - DeepSeek (OpenAI 兼容 API)
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:YOUR-DEEPSEEK-API-KEY}
      chat:
        model: deepseek-chat
        temperature: 0.7
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE
        dimension: 512
        initialize-schema: true

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:offer-pilot-jwt-secret-key-change-in-production}

# MinIO
minio:
  endpoint: http://14.103.58.208:19000
  access-key: ${MINIO_ACCESS_KEY:minio}
  secret-key: ${MINIO_SECRET_KEY:MzL8zWEATiwbftSN}
  bucket: offer-pilot-files

# 日志级别
logging:
  level:
    com.eyki.offerpilot: DEBUG