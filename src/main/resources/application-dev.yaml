# 开发环境配置（CI / docker compose 部署用，本地默认激活 local 个人配置）
# 前置条件：docker compose up -d
# 数据源通过 INFRA_HOST 变量切换，默认 localhost
spring:
  datasource:
    url: jdbc:mysql://${INFRA_HOST:localhost}:3306/offer_pilot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_ROOT_PASSWORD:rootpass}
    driver-class-name: com.mysql.cj.jdbc.Driver

    vector:
      url: jdbc:postgresql://${INFRA_HOST:localhost}:5433/offer_pilot_vector
      username: postgres
      password: ${POSTGRES_PASSWORD:pgpass}
      driver-class-name: org.postgresql.Driver

  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:sk-REPLACED}

minio:
  endpoint: http://${INFRA_HOST:localhost}:19000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}

logging:
  level:
    com.eyki.offerpilot: DEBUG