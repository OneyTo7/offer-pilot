version: "3.8"

services:
  # PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: offer-pilot-pg
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - offer-pilot-net

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: offer-pilot-minio
    restart: unless-stopped
    command: server /data --console-address ":19001"
    env_file:
      - .env
    ports:
      - "19000:9000"
      - "19001:19001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    networks:
      - offer-pilot-net

  # 后端（Spring Boot）
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offer-pilot-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - offer-pilot-net

  # 前端（Nginx SPA）
  frontend:
    build:
      context: ../offer-pilot-ui
      dockerfile: Dockerfile
    container_name: offer-pilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - offer-pilot-net

volumes:
  pgdata:
  minio_data:

networks:
  offer-pilot-net:
    driver: bridge