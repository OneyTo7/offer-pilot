version: '3.8'

services:
  # ========== 基础设施 ==========

  mysql:
    image: mysql:8.0
    container_name: offer-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: offer_pilot
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - offer-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: offer-pgvector
    environment:
      POSTGRES_DB: offer_pilot_vector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    networks:
      - offer-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: offer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - offer-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 后端服务 ==========

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offer-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?sk-bc1608b2b9414b5196ec322a49371d0a}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SA_TOKEN_JWT_SECRET: ${SA_TOKEN_JWT_SECRET:-offer-pilot-jwt-secret-key-change-in-production}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
    ports:
      - "8080:8080"
    networks:
      - offer-network
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always

  # ========== 前端服务（可选，独立仓库） ==========
  # frontend:
  #   build:
  #     context: ../offer-pilot-frontend
  #     dockerfile: Dockerfile
  #   container_name: offer-frontend
  #   ports:
  #     - "80:80"
  #   networks:
  #     - offer-network
  #   depends_on:
  #     - backend
  #   restart: always

volumes:
  mysql-data:
  pgvector-data:
  minio-data:

networks:
  offer-network:
    driver: bridge