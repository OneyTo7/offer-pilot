version: "3.8"

services:
  # PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: offer-pilot-pg
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: offer-pilot-minio
    restart: unless-stopped
    command: server /data --console-address ":19001"
    env_file:
      - .env
    ports:
      - "19000:9000"
      - "19001:19001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

volumes:
  pgdata:
  minio_data: